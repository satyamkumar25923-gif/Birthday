function playBackgroundMusic(audio) {

  const seekAndPlay = () => {

  if (audio.readyState >= 1) seekAndPlay();

// ---------------- SOUND EFFECTS (generated in-browser, no files needed) ----------------
async function ensureAudioContext() {
  const ctx = playPop._ctx || (playPop._ctx = new (window.AudioContext || window.webkitAudioContext)());
  if (ctx.state === "suspended") await ctx.resume();
  return ctx;
}

function playPop(frequency = 520) {
  try {
    const ctx = playPop._ctx || (playPop._ctx = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === "suspended") ctx.resume();
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(frequency, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(frequency * 1.6, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.16, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.24);
  } catch (e) { /* audio not available, ignore quietly */ }
}
function playChime() {
  playPop(700);
  setTimeout(() => playPop(920), 90);

// ---------------- CURSOR HEART TRAIL ----------------
function useHeartCursor() {
  useEffect(() => {
    let last = 0;
    function handleMove(e) {
      const now = Date.now();
      if (now - last < 60) return;
      last = now;
      const heart = document.createElement("div");
      heart.className = "heart-cursor";
      heart.textContent = ["💗", "💓", "💕"][Math.floor(Math.random() * 3)];
      heart.style.left = (e.clientX - 6) + "px";
      heart.style.top = (e.clientY - 6) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    }
    window.addEventListener("mousemove", handleMove);
    return () => window.removeEventListener("mousemove", handleMove);
  }, []);
}

// ---------------- SIMPLE CONFETTI (canvas, no external library) ----------------
function fireConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ["#FF8FAB", "#E6D9FF", "#CDEBFF", "#FFD9E6", "#FFE066"];
  const pieces = Array.from({ length: 140 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.5,
    r: 4 + Math.random() * 6,
    c: colors[Math.floor(Math.random() * colors.length)],
    vy: 2 + Math.random() * 3,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * 360,
    vr: -6 + Math.random() * 12,
    shape: Math.random() > 0.5 ? "rect" : "circle",
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.c;
      if (p.shape === "rect") ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 1.6);
      else { ctx.beginPath(); ctx.arc(0, 0, p.r/2, 0, Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    frame++;
    if (frame < 210) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

// ---------------- AMBIENT BACKGROUND (hearts/stars/butterflies/clouds) ----------------
function AmbientBackground({ variant = "day", onStarClick }) {
  const items = [];
  const daySymbols = ["🎂", "🎈", "🎉", "✨", "💖"];
  const nightSymbols = ["⭐", "✨", "🌙", "💫"];
  const symbols = variant === "night" ? nightSymbols : daySymbols;

  for (let i = 0; i < 18; i++) {
    const symbol = symbols[i % symbols.length];
    const left = (i * 53) % 100;
    const top = (i * 37) % 100;
    const delay = (i % 6) * 0.6;
    const size = 14 + (i % 5) * 6;
    const isStar = symbol === "⭐" || symbol === "✨";
    const animClass = isStar && onStarClick
      ? "star-clickable"
      : `anim-float${i % 2 ? "-slow" : ""}`;
    items.push(
      <span
        key={i}
        onClick={isStar && onStarClick ? () => onStarClick(i) : undefined}
        className={`absolute select-none ${animClass}`}
        style={{
          left: `${left}%`,
          top: `${top}%`,
          fontSize: `${size}px`,
          opacity: 0.55,
          animationDelay: `${delay}s`,
        }}
      >
        {symbol}
      </span>
    );
  }
  return <div className="pointer-events-none absolute inset-0 overflow-hidden">{items.map((el, i) =>
    el.props.onClick ? React.cloneElement(el, { key: i, className: el.props.className + " pointer-events-auto" }) : el
  )}</div>;
}

  const greeting = `Happy Birthday, ${FRIEND_NAME}! 🎂 I made something special to celebrate you.`;

  useEffect(() => {

  return (
    <section className="relative min-h-screen w-full flex flex-col items-center justify-center text-center px-6 bg-dreamy overflow-hidden">
      <AmbientBackground variant="day" />
      <div className="relative z-10 max-w-2xl scene-enter">
        <p className="text-sm sm:text-base uppercase tracking-[0.3em] text-rose font-semibold mb-4">it's your special day</p>

          {greeting.slice(0, visibleChars)}

        <button
          onClick={() => { playChime(); onStart(); }}
          className="btn-bouncy anim-glow mt-10 inline-block rounded-full bg-rose text-white font-display text-lg px-10 py-4 shadow-lg"
        >
          Celebrate With Me 🎈
        </button>
      </div>
    </section>
  );
}

// ---------------- QUESTION CARD ----------------
function QuestionJourney({ onFinish }) {
  const [index, setIndex] = useState(0);
  const [selected, setSelected] = useState(null);
  const [burstHearts, setBurstHearts] = useState([]);
  const q = QUESTIONS[index];

  function choose(option) {
    if (selected) return;
    setSelected(option);
    playPop(480 + index * 40);
    const hearts = Array.from({ length: 8 }, (_, i) => ({
      id: `${index}-${i}-${Date.now()}`,
      left: 45 + Math.random() * 10,
      delay: i * 0.05,
      symbol: ["💖", "💕", "✨"][i % 3],
    }));
    setBurstHearts(hearts);
    setTimeout(() => {
      setIndex((prev) => {
        if (prev + 1 < QUESTIONS.length) {
          setSelected(null);
          setBurstHearts([]);
          return prev + 1;
        }
        onFinish();
        return prev;
      });
    }, 1100);
  }

  return (
    <section className="relative min-h-screen w-full flex flex-col items-center justify-center px-6 bg-dreamy overflow-hidden">
      <AmbientBackground variant="day" />
      <div className="relative z-10 w-full max-w-md">
        <div className="flex justify-center gap-2 mb-6">
          {QUESTIONS.map((_, i) => (
            <div key={i} className={`h-2 rounded-full transition-all duration-500 ${i === index ? "w-8 bg-rose" : i < index ? "w-4 bg-rose/50" : "w-4 bg-plum/15 dark:bg-white/15"}`} />
          ))}
        </div>

        <div key={q.id} className="anim-pop glass rounded-3xl shadow-2xl p-8 text-center relative">
          <div className="mb-3 flex justify-center min-h-[7rem] items-center">
            {q.gif ? (
              <div className="question-gif-wrap">
                <img src={q.gif} alt="" className="question-gif h-28 sm:h-32 w-auto object-contain" />
              </div>
            ) : (
              <span className="text-5xl">{q.emoji}</span>
            )}
          </div>
          <h2 className="font-display text-xl sm:text-2xl text-plum dark:text-white mb-6">{q.text}</h2>
          <div className="flex flex-col gap-3">
            {q.options.map((opt, i) => (
              <button
                key={i}
                onClick={() => choose(opt)}
                disabled={!!selected}
                className={`btn-bouncy rounded-2xl px-5 py-3 font-semibold text-sm sm:text-base border-2 transition-colors ${
                  selected === opt
                    ? "bg-rose text-white border-rose"
                    : "bg-white/70 dark:bg-white/10 border-transparent hover:border-rose text-plum dark:text-white"
                }`}
              >
                {opt}
              </button>
            ))}
          </div>

          <div className="pointer-events-none absolute inset-x-0 bottom-0 h-0 flex justify-center">
            {burstHearts.map(h => (
              <span
                key={h.id}
                className="absolute text-2xl"
                style={{ left: `${h.left}%`, bottom: 0, animation: `riseFade 1s ease-out ${h.delay}s both` }}
              >
                {h.symbol}
              </span>
            ))}
          </div>
        </div>

        <p className="text-center mt-6 text-xs uppercase tracking-widest text-plum/50 dark:text-white/50">
          question {index + 1} of {QUESTIONS.length}
        </p>
      </div>
    </section>
  );
}

// ---------------- POLAROID ----------------
function Polaroid({ memory }) {
  return (
    <div className={`polaroid ${memory.rotate} w-44 sm:w-52`}>
      <div className="w-full aspect-square bg-gradient-to-br from-blush via-lavender to-skyblue flex items-center justify-center text-5xl rounded-sm overflow-hidden">
        {memory.src ? (
          <img
            src={memory.src}
            alt={memory.caption}
            className="w-full h-full object-cover"
            style={{ objectPosition: memory.position || "center center" }}
            loading="lazy"
          />
        ) : (
          memory.emoji
        )}
      </div>
      <p className="font-display text-xs sm:text-sm text-center mt-3 text-plum">{memory.caption}</p>
    </div>
  );
}

// ---------------- MEMORY PAGE ----------------
function MemoryPage({ onNext }) {
  const [typed, setTyped] = useState(0);
  useEffect(() => {
    const interval = setInterval(() => {
      setTyped(t => {
        if (t >= TYPEWRITER_LINE.length) { clearInterval(interval); return t; }
        return t + 1;
      });
    }, 40);
    return () => clearInterval(interval);
  }, []);

  return (
    <section className="relative min-h-screen w-full flex flex-col items-center justify-center px-6 py-20 bg-dreamy overflow-hidden">
      <AmbientBackground variant="day" />
      <div className="relative z-10 max-w-4xl w-full text-center scene-enter">
        <p className="text-sm uppercase tracking-[0.3em] text-rose font-semibold mb-3">birthday memories</p>
        <h2 className="font-display text-2xl sm:text-4xl text-plum dark:text-white mb-10 min-h-[3.5rem]">
          {TYPEWRITER_LINE.slice(0, typed)}
          <span className="typewriter-cursor"></span>
        </h2>

        <div className="flex flex-wrap justify-center gap-6 sm:gap-8">
          {MEMORIES.map((m, i) => <Polaroid key={i} memory={m} />)}
        </div>

        <button
          onClick={() => { playChime(); onNext(); }}
          className="btn-bouncy mt-14 inline-block rounded-full bg-rose text-white font-display text-lg px-10 py-4 shadow-lg"
        >
          Your birthday wish awaits... 🎁
        </button>
      </div>
    </section>
  );
}

// ---------------- FINAL WISH PAGE ----------------
function FinalWishPage({ onNext }) {
  useEffect(() => {
    fireConfetti();
    const t = setTimeout(fireConfetti, 900);
    return () => clearTimeout(t);
  }, []);

  return (
    <section className="relative min-h-screen w-full flex flex-col items-center justify-center px-6 bg-dreamy overflow-hidden">
      <AmbientBackground variant="day" />
      <div className="relative z-10 max-w-2xl text-center scene-enter glass rounded-3xl p-10 shadow-2xl">
        <div className="mb-6 flex justify-center">
          <img
            src={FINAL_WISH_GIF}
            alt=""
            className="h-40 sm:h-48 w-auto rounded-2xl object-contain shadow-lg"
          />
        </div>
        <h2 className="font-display text-2xl sm:text-3xl text-plum dark:text-white leading-relaxed">
          {FINAL_WISH_MESSAGE}
        </h2>
        <button
          onClick={() => { playChime(); onNext(); }}
          className="btn-bouncy anim-glow mt-10 inline-block rounded-full bg-rose text-white font-display text-lg px-10 py-4 shadow-lg"
        >
          One more surprise... 🎈
        </button>
      </div>
    </section>
  );
}

// ---------------- SURPRISE PAGE (night sky) ----------------
function SurprisePage({ onEasterEgg, onRestart }) {
  const lanterns = [
    { left: "12%", delay: "0s", size: "text-4xl" },
    { left: "28%", delay: "1.2s", size: "text-3xl" },
    { left: "50%", delay: "0.6s", size: "text-5xl" },
    { left: "70%", delay: "1.8s", size: "text-3xl" },
    { left: "85%", delay: "0.3s", size: "text-4xl" },
  ];

  return (
    <section className="relative min-h-screen w-full flex flex-col items-center justify-center px-6 overflow-hidden bg-gradient-to-b from-[#1A1530] via-[#241b3f] to-[#2E2350]">
      <AmbientBackground variant="night" onStarClick={onEasterEgg} />

      {lanterns.map((l, i) => (
        <span
          key={i}
          className={`absolute bottom-0 ${l.size} lantern-glow anim-lantern select-none`}
          style={{ left: l.left, animationDelay: l.delay }}
        >
          🏮
        </span>
      ))}

      <div className="relative z-10 max-w-xl text-center scene-enter">
        <div className="mb-6 flex justify-center">
          <img
            src={SURPRISE_GIF}
            alt=""
            className="h-36 sm:h-44 w-auto object-contain"
          />
        </div>
        <h2 className="font-display text-2xl sm:text-3xl text-white leading-relaxed">
          {SURPRISE_MESSAGE}
        </h2>
        <button
          onClick={() => { playChime(); onRestart(); }}
          className="btn-bouncy mt-10 inline-block rounded-full bg-white/10 border border-white/40 text-white font-display text-base px-8 py-3 shadow-lg hover:bg-white/20"
        >
          Relive it all again 🔁
        </button>
      </div>
    </section>
  );
}

// ---------------- APP ROOT ----------------
const SCENES = ["hello", "questions", "memories", "wish", "surprise"];

function App() {
  const [loading, setLoading] = useState(true);
  const [scene, setScene] = useState(0);
  const [dark, setDark] = useState(false);
  const [musicOn, setMusicOn] = useState(!!MUSIC_URL);
  const [egg, setEgg] = useState(null);
  const audioRef = useRef(null);

  useHeartCursor();

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
  }, [dark]);

  useEffect(() => {
    if (!audioRef.current || !MUSIC_URL) return;
    if (musicOn) playBackgroundMusic(audioRef.current);
    else audioRef.current.pause();
  }, [musicOn]);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || !MUSIC_URL) return;
    const onEnded = () => {
      audio.currentTime = MUSIC_START_SECONDS;
      audio.play().catch(() => {});
    };
    audio.addEventListener("ended", onEnded);
    return () => audio.removeEventListener("ended", onEnded);
  }, []);

  const startMusic = useCallback(() => {
    if (!MUSIC_URL) return;
    setMusicOn(true);
    if (audioRef.current) playBackgroundMusic(audioRef.current);
  }, []);

  const goTo = useCallback((i) => setScene(i), []);
  const triggerEgg = useCallback(() => {
    setEgg(EASTER_EGGS[Math.floor(Math.random() * EASTER_EGGS.length)]);
    playPop(880);
  }, []);

  if (loading) return <LoadingScreen onDone={() => setLoading(false)} />;

  return (
    <div className="min-h-screen">
      <canvas id="confetti-canvas"></canvas>

      {/* BACKGROUND MUSIC: set MUSIC_URL near the top of the script */}
      {MUSIC_URL ? (
        <audio ref={audioRef} preload="metadata">
          <source src={MUSIC_URL} type="audio/webm" />
        </audio>
      ) : (
        <audio ref={audioRef} preload="none" />
      )}

      <TopControls dark={dark} setDark={setDark} musicOn={musicOn} setMusicOn={setMusicOn} musicAvailable={!!MUSIC_URL} />
      <ProgressRibbon scenes={["hello", "questions", "memories", "wish", "surprise"]} current={scene} />

      {scene === 0 && <Hero onStart={() => { startMusic(); goTo(1); }} />}
      {scene === 1 && <QuestionJourney onFinish={() => goTo(2)} />}
      {scene === 2 && <MemoryPage onNext={() => goTo(3)} />}
      {scene === 3 && <FinalWishPage onNext={() => goTo(4)} />}
      {scene === 4 && <SurprisePage onEasterEgg={triggerEgg} onRestart={() => goTo(0)} />}

      {egg && <EasterEggToast message={egg} onClose={() => setEgg(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
